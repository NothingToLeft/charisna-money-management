name: Build Windows EXE v14.1.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows-v14.yml"

# Installer dipublikasikan ke GitHub Releases agar tidak memakai
# kuota GitHub Actions artifact.
permissions:
  contents: write

concurrency:
  group: windows-v14.1.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Validate desktop version
        shell: pwsh
        run: |
          $package = Get-Content "windows/package.json" -Raw | ConvertFrom-Json
          if ($package.version -ne "14.1.1") {
            throw "Versi windows/package.json harus 14.1.1, ditemukan $($package.version)."
          }

      - name: Install Windows desktop dependencies
        working-directory: windows
        run: npm ci --no-audit --no-fund

      - name: Build Windows x64 installer
        working-directory: windows
        run: npm run dist:win

      - name: Prepare installer, update metadata, and checksum
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "windows/dist"
          $release = Join-Path $env:GITHUB_WORKSPACE "release-windows"
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          $setup = Get-ChildItem $dist -File -Filter "CHARISNA-Money-Management-Setup-v14.1.1-x64.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "Installer EXE tidak ditemukan di windows/dist."
          }

          $setupDest = Join-Path $release $setup.Name
          Copy-Item $setup.FullName $setupDest -Force

          $checksumName = "$($setup.Name).sha256"
          $checksumPath = Join-Path $release $checksumName
          $hash = (Get-FileHash $setupDest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -Path $checksumPath -Encoding ascii

          $latest = Join-Path $dist "latest.yml"
          if (Test-Path $latest) {
            Copy-Item $latest (Join-Path $release "latest.yml") -Force
          }

          Get-ChildItem $dist -File -Filter "*.blockmap" | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $release $_.Name) -Force
          }

          "setup_name=$($setup.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_name=$checksumName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v14.1.1
        run: |
          $ErrorActionPreference = "Stop"
          gh release view $env:TAG_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG_NAME `
              --target $env:GITHUB_SHA `
              --title "CHARISNA Money Management v14.1.1" `
              --notes "CHARISNA Money Management v14.1.1 untuk Android dan Windows. Fitur: multi-akun keuangan, transfer antar akun, dan buka dashboard otomatis setelah PIN benar."

            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 5
              gh release view $env:TAG_NAME | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "GitHub Release v14.1.1 tidak dapat dibuat atau ditemukan."
              }
            }
          }

          Get-ChildItem "$env:GITHUB_WORKSPACE/release-windows" -File | ForEach-Object {
            gh release upload $env:TAG_NAME $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Gagal mengunggah asset: $($_.Name)"
            }
          }

      - name: Write build summary
        shell: pwsh
        env:
          SETUP_NAME: ${{ steps.package.outputs.setup_name }}
          CHECKSUM_NAME: ${{ steps.package.outputs.checksum_name }}
        run: |
          @"
          ## Build Windows selesai

          Installer: ``$env:SETUP_NAME``

          Checksum: ``$env:CHECKSUM_NAME``

          Unduh dari menu **Releases** pada tag **v14.1.1**.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
